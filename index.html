<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon poste alimentation</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alimentation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1C2420; --muted:#5F6E65; --line:#D5DCD4; --soft:#E2E8E1;
  --accent:#B8325A; --on-accent:#FFFFFF;
  --c-drive:#3E6B4F; --c-magasin:#C08A2E; --c-livraison:#B8325A; --c-cantine:#4A6FA5; --c-ecole:#7B5BA6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1B231F; --ink:#E7ECE8; --muted:#97A59C; --line:#2C3732; --soft:#232D28;
    --accent:#E46D90; --on-accent:#1B0B11;
    --c-drive:#6FA683; --c-magasin:#D9A84E; --c-livraison:#E46D90; --c-cantine:#7C9DD0; --c-ecole:#A88BD0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --ink:#E7ECE8; --muted:#97A59C; --line:#2C3732; --soft:#232D28;
  --accent:#E46D90; --on-accent:#1B0B11;
  --c-drive:#6FA683; --c-magasin:#D9A84E; --c-livraison:#E46D90; --c-cantine:#7C9DD0; --c-ecole:#A88BD0;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.45;font-size:16px;
}
main{max-width:560px;margin:0 auto;padding:18px 16px 56px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* En-tête : le mois et son assiette */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav button{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);font-size:22px;line-height:1;cursor:pointer;
}
.month-name{font-size:1.05rem;font-weight:500;text-transform:capitalize;color:var(--muted)}
.total{
  font-size:clamp(2.8rem,13vw,4.2rem);font-weight:800;letter-spacing:-.03em;
  font-variation-settings:"opsz" 96;line-height:1;margin:14px 0 4px;
}
.total-sub{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--soft);gap:2px}
.bar.empty{border:2px dashed var(--line);background:transparent}
.bar span{display:block;height:100%;transition:width .35s ease}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr auto;row-gap:6px;column-gap:12px}
.legend li{display:contents}
.legend .lbl{display:flex;align-items:center;gap:8px}
.legend .amt{text-align:right;font-weight:500}
.dot{width:12px;height:12px;border-radius:4px;flex:none}

/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{
  background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:500;
  border-bottom:3px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
[hidden]{display:none!important}

/* Saisie */
fieldset{border:0;margin:0 0 18px;padding:0}
legend,.field-label{font-weight:500;margin-bottom:8px;display:block;padding:0}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;inset:0;margin:0}
.cats span{
  display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
}
.cats input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cats input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.row.one{grid-template-columns:1fr}
.input{
  width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:16px;min-height:48px;
}
.amount-input{font-size:1.5rem;font-weight:700}
.hint{color:var(--muted);font-size:.88rem;margin:-8px 0 16px}
.primary{
  width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);
  font-weight:700;font-size:1.05rem;cursor:pointer;
}
.secondary{
  min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:500;
}

/* Liste du mois */
.day{margin:0 0 14px}
.day h3{font-size:.9rem;font-weight:500;color:var(--muted);margin:0 0 6px}
.entry{
  display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 10px 12px;margin-bottom:6px;
}
.entry .what{min-width:0}
.entry .what small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .amt{font-weight:700}
.del{width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:8px}
.empty-msg{color:var(--muted);padding:20px 0}

/* Bilan */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat.wide{grid-column:1/-1}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:.9rem}
.months{list-style:none;margin:0;padding:0}
.months button{
  width:100%;display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:10px;
  background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;text-align:left;
}
.months .m{text-transform:capitalize}
.months .mini{display:flex;height:10px;border-radius:4px;overflow:hidden;gap:1px}
.months .v{font-weight:700;min-width:5.5em;text-align:right}
.months button[aria-pressed="true"]{opacity:.45}
.months button[aria-pressed="true"] .v{text-decoration:line-through}
.section-title{font-size:1.1rem;font-weight:700;margin:26px 0 10px}
details{margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:500;padding:6px 0}
.settings-grid{display:grid;grid-template-columns:1fr 7em;gap:10px 12px;align-items:center;margin:12px 0 18px}
.months .m small{display:block;color:var(--muted);font-size:.8rem;text-transform:none}
.days{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.days label{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.status{color:var(--muted);font-size:.85rem;margin-top:22px}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.bar span,.toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="month-nav">
      <button id="prev" aria-label="Mois précédent">‹</button>
      <div class="month-name" id="monthName"></div>
      <button id="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="total" id="monthTotal">0,00 €</div>
    <p class="total-sub" id="monthSub"></p>
    <p class="total-sub" id="schoolSub" hidden></p>
    <div class="bar" id="monthBar" role="img"></div>
    <ul class="legend" id="monthLegend"></ul>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="saisie">Saisir</button>
    <button role="tab" aria-selected="false" data-tab="liste">Ce mois</button>
    <button role="tab" aria-selected="false" data-tab="bilan">Bilan</button>
  </nav>

  <section id="tab-saisie">
    <fieldset>
      <legend>Catégorie</legend>
      <div class="cats" id="catPicker"></div>
    </fieldset>

    <div id="perDayBox" hidden>
      <div class="row">
        <div>
          <label class="field-label" for="rateSel">Tarif</label>
          <select class="input" id="rateSel"></select>
        </div>
        <div>
          <label class="field-label" for="days">Nombre de jours</label>
          <input class="input" id="days" type="number" inputmode="numeric" min="1" step="1" value="1">
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label class="field-label" for="amount">Montant (€)</label>
        <input class="input amount-input" id="amount" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
      <div>
        <label class="field-label" for="date">Date</label>
        <input class="input" id="date" type="date">
      </div>
    </div>
    <p class="hint" id="amountHint" hidden></p>

    <div class="row one">
      <div>
        <label class="field-label" for="note">Note (facultatif)</label>
        <input class="input" id="note" placeholder="ex. réassort pain et lait" autocomplete="off">
      </div>
    </div>

    <button class="primary" id="addBtn">Ajouter la dépense</button>
  </section>

  <section id="tab-liste" hidden>
    <div id="list"></div>
  </section>

  <section id="tab-bilan" hidden>
    <div class="row one">
      <div>
        <label class="field-label" for="period">Période</label>
        <select class="input" id="period">
          <option value="3">3 derniers mois</option>
          <option value="6">6 derniers mois</option>
          <option value="12" selected>12 derniers mois</option>
          <option value="0">Tout</option>
        </select>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <h2 class="section-title">Par mois</h2>
    <p class="hint" style="margin:0 0 8px">Touchez un mois pour l'exclure de la moyenne (vacances, mois incomplet).</p>
    <ul class="months" id="months"></ul>

    <details>
      <summary>Tarifs et export</summary>
      <div class="settings-grid">
        <label for="r-cantine">Ma cantine (€ / jour)</label>
        <input class="input" id="r-cantine" inputmode="decimal">
        <label for="r-internat">Internat (€ / jour)</label>
        <input class="input" id="r-internat" inputmode="decimal">
        <label for="r-demipension">Demi-pension (€ / repas)</label>
        <input class="input" id="r-demipension" inputmode="decimal">
        <label for="demiFrom">Demi-pension à partir du</label>
        <input class="input" id="demiFrom" type="date">
        <span>Jours de cantine de ma fille</span>
        <span></span>
        <div class="days" id="schoolDays"></div>
      </div>
      <button class="secondary" id="saveRates">Enregistrer les réglages</button>
      <button class="secondary" id="exportBtn">Exporter en CSV</button>
      <button class="secondary" id="importBtn">Importer un CSV</button>
      <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
      <button class="secondary" id="clearBtn">Tout effacer</button>
    </details>
  </section>

  <p class="status" id="status">Chargement…</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = [
  {id:'drive',     label:'Drive Monoprix',          group:'maison'},
  {id:'magasin',   label:'Magasin',                 group:'maison'},
  {id:'livraison', label:'Livraison de repas',      group:'dehors'},
  {id:'cantine',   label:'Ma cantine',              group:'dehors', rates:['cantine']},
  {id:'ecole',     label:'Repas école de ma fille', group:'dehors', rates:['internat','demipension']},
];
const RATE_LABELS = {cantine:'Ma cantine', internat:'Internat', demipension:'Demi-pension'};
const DEFAULTS = {rates:{cantine:8, internat:13.4, demipension:7}, excluded:[], demiFrom:'2026-11-02', schoolDays:[1,2,4,5]};
const WD = [[1,'lun.'],[2,'mar.'],[3,'mer.'],[4,'jeu.'],[5,'ven.']];
const catById = Object.fromEntries(CATS.map(c=>[c.id,c]));
const eur = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const $ = id => document.getElementById(id);
const colorVar = id => `var(--c-${id})`;

const state = {
  mode:'loading', entries:[], settings:structuredClone(DEFAULTS),
  month: ymOf(new Date()), cat:'drive', tab:'saisie',
};
let remote = null; // {entries, settings}
let downloads = null;

function ymOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthLabel(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function shiftMonth(ym,n){const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+n,1))}
function parseAmount(s){const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)?Math.round(v*100)/100:NaN}
function fmtNum(v){return String(v).replace('.',',')}

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- Calendrier scolaire (vacances.csv) ---------- */
let holidays=[];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseVacances(text){
  const isD=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
  return text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'))
    .map(l=>l.split(';').map(x=>x.trim().replace(/^"|"$/g,'')))
    .filter(c=>isD(c[0]))
    .map(c=>({debut:c[0],reprise:isD(c[1])?c[1]:c[0].slice(0,4)+'-09-01',nom:c[2]||''}));
}
async function loadVacances(){
  let text=null;
  try{const r=await fetch('vacances.csv',{cache:'no-cache'});if(r.ok){text=await r.text();try{localStorage.setItem('alim-vacances',text)}catch(_){}}}catch(_){}
  if(!text){try{text=localStorage.getItem('alim-vacances')}catch(_){}}
  holidays=text?parseVacances(text):[];
  render();
}
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
const ferieCache={};
function feries(y){
  if(ferieCache[y]) return ferieCache[y];
  const e=easter(y),plus=n=>{const x=new Date(e);x.setDate(x.getDate()+n);return iso(x)};
  return ferieCache[y]=new Set([y+'-01-01',y+'-05-01',y+'-05-08',y+'-07-14',y+'-08-15',y+'-11-01',y+'-11-11',y+'-12-25',plus(1),plus(39),plus(50)]);
}
const isVacation=d=>holidays.some(h=>d>=h.debut&&d<h.reprise);
function calendarKnown(ym){
  if(!holidays.length) return false;
  const min=holidays.reduce((a,h)=>h.debut<a?h.debut:a,'9999'),max=holidays.reduce((a,h)=>h.reprise>a?h.reprise:a,'0000');
  return ym>=min.slice(0,7)&&ym<=max.slice(0,7);
}
/* jours ouvrés du mois : classe / vacances, et repas de demi-pension attendus */
function monthCal(ym){
  if(!calendarKnown(ym)) return null;
  const [y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate();
  const sd=new Set(state.settings.schoolDays||DEFAULTS.schoolDays);
  let classe=0,vac=0,repas=0;
  for(let d=1;d<=n;d++){
    const dt=new Date(y,m-1,d),wd=dt.getDay(),s=iso(dt);
    if(wd===0||wd===6||feries(y).has(s)) continue;
    if(isVacation(s)) vac++;
    else{classe++; if(sd.has(wd)&&s>=(state.settings.demiFrom||'9999')) repas++}
  }
  return {classe,vac,repas,type:vac>=(classe+vac)/2?'vacances':'scolaire'};
}

/* ---------- Stockage ---------- */
function loadLocal(){
  try{
    const e=JSON.parse(localStorage.getItem('alim-entries')||'[]');
    const s=JSON.parse(localStorage.getItem('alim-settings')||'null');
    state.entries=Array.isArray(e)?e:[];
    if(s) state.settings={...structuredClone(DEFAULTS),...s,rates:{...DEFAULTS.rates,...(s.rates||{})}};
  }catch(_){}
}
function saveLocal(){
  try{
    localStorage.setItem('alim-entries',JSON.stringify(state.entries));
    localStorage.setItem('alim-settings',JSON.stringify(state.settings));
  }catch(_){}
}
function useLocal(){
  state.mode='local';loadLocal();
  $('status').textContent="Données enregistrées dans ce navigateur uniquement. Exportez une sauvegarde CSV chaque mois.";
  render();
}

async function init(){
  render();
  if(!window.claude||!window.claude.use){useLocal();return}
  try{
    const [db,user,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
    downloads=dl;
    const uid = db&&user ? await user.id() : null;
    if(!db||!uid){useLocal();return}
    const base='data/users/'+uid;
    remote={
      entries: db.doc(base+'/journal').collection('entries'),
      settings: db.doc(base+'/settings'),
    };
    state.mode='db';
    $('status').textContent="Données enregistrées dans votre compte, visibles de vous seule.";
    remote.entries.onSnapshot(snap=>{
      state.entries=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    },()=>{$('status').textContent="Connexion perdue : rechargez la page pour retrouver vos données."});
    remote.settings.onSnapshot(s=>{
      if(s.exists){const d=s.data();state.settings={...structuredClone(DEFAULTS),...d,rates:{...DEFAULTS.rates,...(d.rates||{})}}}
      fillRates();render();
    });
  }catch(_){useLocal()}
}

async function addEntry(e){
  e.createdAt=Date.now();
  if(state.mode==='db'){await remote.entries.add(e)}
  else{e.id='e'+e.createdAt+Math.random().toString(36).slice(2,7);state.entries.push(e);saveLocal();render()}
}
async function deleteEntry(id){
  if(state.mode==='db'){await remote.entries.doc(id).delete()}
  else{state.entries=state.entries.filter(x=>x.id!==id);saveLocal();render()}
}
async function saveSettings(){
  if(state.mode==='db'){await remote.settings.set(structuredClone(state.settings))}
  else{saveLocal()}
  render();
}

/* ---------- Calculs ---------- */
function byMonth(){
  const map={};
  for(const e of state.entries){
    const ym=(e.date||'').slice(0,7); if(!ym) continue;
    map[ym]??={total:0,cats:{}};
    map[ym].total+=e.amount; map[ym].cats[e.cat]=(map[ym].cats[e.cat]||0)+e.amount;
  }
  return map;
}
function barSpans(cats,total,el){
  el.innerHTML='';
  for(const c of CATS){
    const v=cats[c.id]||0; if(!v) continue;
    const s=document.createElement('span');
    s.style.width=(v/total*100)+'%';s.style.background=colorVar(c.id);s.title=c.label+' : '+eur.format(v);
    el.appendChild(s);
  }
}

/* ---------- Rendu ---------- */
function render(){
  const months=byMonth();
  const cur=months[state.month]||{total:0,cats:{}};
  $('monthName').textContent=monthLabel(state.month);
  $('monthTotal').textContent=eur.format(cur.total);
  const n=state.entries.filter(e=>(e.date||'').startsWith(state.month)).length;
  $('monthSub').textContent = n ? `${n} dépense${n>1?'s':''} saisie${n>1?'s':''}` : 'Aucune dépense saisie ce mois-ci';
  const cal=monthCal(state.month),ss=$('schoolSub');
  if(cal){
    let t=`${cal.classe} jour${cal.classe>1?'s':''} de classe, ${cal.vac} de vacances.`;
    if(cal.repas) t+=` Demi-pension attendue : ${cal.repas} repas, ${eur.format(cal.repas*state.settings.rates.demipension)}.`;
    ss.textContent=t;ss.hidden=false;
  }else ss.hidden=true;
  const bar=$('monthBar');
  bar.classList.toggle('empty',!cur.total);
  barSpans(cur.cats,cur.total||1,bar);
  bar.setAttribute('aria-label',CATS.map(c=>`${c.label} ${eur.format(cur.cats[c.id]||0)}`).join(', '));
  const lg=$('monthLegend');lg.innerHTML='';
  for(const c of CATS){
    const v=cur.cats[c.id]||0; if(!v) continue;
    const li=document.createElement('li');
    li.innerHTML=`<span class="lbl"><i class="dot" style="background:${colorVar(c.id)}"></i><span></span></span><span class="amt"></span>`;
    li.querySelector('.lbl span').textContent=c.label;
    li.querySelector('.amt').textContent=eur.format(v)+'  ('+Math.round(v/cur.total*100)+' %)';
    lg.appendChild(li);
  }
  renderList();renderBilan(months);
}

function renderCats(){
  const box=$('catPicker');box.innerHTML='';
  for(const c of CATS){
    const l=document.createElement('label');
    l.innerHTML=`<input type="radio" name="cat" value="${c.id}"><span><i class="dot" style="background:${colorVar(c.id)}"></i></span>`;
    l.querySelector('span').append(c.label);
    const inp=l.querySelector('input');inp.checked=c.id===state.cat;
    inp.addEventListener('change',()=>{state.cat=c.id;updatePerDay()});
    box.appendChild(l);
  }
}
function updatePerDay(){
  const c=catById[state.cat];
  $('perDayBox').hidden=!c.rates;
  $('amountHint').hidden=!c.rates;
  if(c.rates){
    const sel=$('rateSel');sel.innerHTML='';
    for(const r of c.rates){
      const o=document.createElement('option');o.value=r;
      o.textContent=`${RATE_LABELS[r]} (${eur.format(state.settings.rates[r])})`;sel.appendChild(o);
    }
    computePerDay();
  }else{$('amount').value=''}
}
function computePerDay(){
  const r=state.settings.rates[$('rateSel').value]||0;
  const d=Math.max(1,parseInt($('days').value,10)||1);
  $('amount').value=fmtNum((Math.round(r*d*100)/100).toFixed(2));
  $('amountHint').textContent=`${d} × ${eur.format(r)}. Vous pouvez saisir une semaine entière d'un coup.`;
}

function renderList(){
  const box=$('list');box.innerHTML='';
  const items=state.entries.filter(e=>(e.date||'').startsWith(state.month))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  if(!items.length){box.innerHTML='<p class="empty-msg">Rien pour ce mois. Ajoutez une dépense dans l\'onglet Saisir.</p>';return}
  let day=null,sec=null;
  for(const e of items){
    if(e.date!==day){
      day=e.date;sec=document.createElement('div');sec.className='day';
      const h=document.createElement('h3');
      h.textContent=new Date(day+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      sec.appendChild(h);box.appendChild(sec);
    }
    const c=catById[e.cat]||{label:e.cat};
    const row=document.createElement('div');row.className='entry';
    row.innerHTML=`<i class="dot" style="background:${colorVar(e.cat)}"></i><div class="what"><div></div><small></small></div><div class="amt"></div><button class="del" aria-label="Supprimer">×</button>`;
    row.querySelector('.what div').textContent=c.label;
    const detail=[e.qty&&e.rateKey?`${e.qty} j × ${eur.format(e.rate)} (${RATE_LABELS[e.rateKey]||''})`:'',e.note||''].filter(Boolean).join(' – ');
    row.querySelector('small').textContent=detail;
    if(!detail) row.querySelector('small').remove();
    row.querySelector('.amt').textContent=eur.format(e.amount);
    row.querySelector('.del').addEventListener('click',async()=>{
      if(!confirm(`Supprimer ${c.label} ${eur.format(e.amount)} ?`)) return;
      try{await deleteEntry(e.id);toast('Dépense supprimée')}catch(_){toast('Suppression impossible, réessayez')}
    });
    sec.appendChild(row);
  }
}

function renderBilan(months){
  const now=ymOf(new Date());
  const keys=Object.keys(months).sort();
  const nPeriod=parseInt($('period').value,10);
  let list=[];
  if(keys.length){
    let start=keys[0];
    if(nPeriod) {const s=shiftMonth(now,-(nPeriod-1)); if(s>start) start=s}
    for(let m=start;m<=now;m=shiftMonth(m,1)) list.push(m);
  }
  const excl=new Set(state.settings.excluded||[]);
  const used=list.filter(m=>!excl.has(m));
  const sumCat=id=>used.reduce((a,m)=>a+((months[m]?.cats[id])||0),0);
  const tot=used.reduce((a,m)=>a+(months[m]?.total||0),0);
  const avg=used.length?tot/used.length:0;
  const maison=CATS.filter(c=>c.group==='maison').reduce((a,c)=>a+sumCat(c.id),0);
  const dehors=tot-maison;
  const st=$('stats');
  if(!used.length){st.innerHTML='<p class="empty-msg stat wide">Pas encore assez de données sur cette période.</p>'}
  else{
    st.innerHTML='';
    const add=(v,l,wide)=>{const d=document.createElement('div');d.className='stat'+(wide?' wide':'');d.innerHTML='<b></b><span></span>';d.querySelector('b').textContent=v;d.querySelector('span').textContent=l;st.appendChild(d)};
    add(eur.format(avg),`Moyenne par mois, sur ${used.length} mois retenu${used.length>1?'s':''}`,true);
    add(eur.format(maison/used.length),'Courses maison / mois (drive + magasin)');
    add(eur.format(dehors/used.length),'Repas dehors / mois (livraison, cantines, école)');
    const typed=t=>used.filter(m=>monthCal(m)?.type===t);
    const sc=typed('scolaire'),va=typed('vacances');
    const avgOf=l=>l.length?l.reduce((a,m)=>a+(months[m]?.total||0),0)/l.length:null;
    const aS=avgOf(sc),aV=avgOf(va);
    if(aS!=null) add(eur.format(aS),`Mois scolaire moyen (${sc.length} mois)`);
    if(aV!=null) add(eur.format(aV),`Mois de vacances moyen (${va.length} mois)`);
    let proj=0,ok=true;
    for(let i=0,m=now;i<12;i++,m=shiftMonth(m,1)){
      const c=monthCal(m); if(!c){ok=false;break}
      proj+=(c.type==='vacances'?(aV??avg):(aS??avg));
    }
    add(eur.format(ok?proj:avg*12),ok?'Projection sur les 12 prochains mois, selon le calendrier scolaire':'Projection sur 12 mois (calendrier scolaire incomplet)');
    add(tot?Math.round(dehors/tot*100)+' %':'–','Part des repas dehors');
  }
  const ul=$('months');ul.innerHTML='';
  const max=Math.max(1,...list.map(m=>months[m]?.total||0));
  for(const m of [...list].reverse()){
    const d=months[m]||{total:0,cats:{}};
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.setAttribute('aria-pressed',excl.has(m)?'true':'false');
    b.innerHTML=`<span class="m"><span></span><small></small></span><span class="mini"></span><span class="v"></span>`;
    b.querySelector('.m span').textContent=monthLabel(m);
    const mc=monthCal(m);
    b.querySelector('.m small').textContent=mc?(mc.type==='vacances'?'surtout vacances':`${mc.classe} j. de classe`):'';
    const mini=b.querySelector('.mini');mini.style.width=(d.total/max*100)+'%';barSpans(d.cats,d.total||1,mini);
    b.querySelector('.v').textContent=eur.format(d.total);
    b.setAttribute('aria-label',`${monthLabel(m)}, ${eur.format(d.total)}${excl.has(m)?', exclu de la moyenne':''}`);
    b.addEventListener('click',async()=>{
      const s=new Set(state.settings.excluded||[]);
      s.has(m)?s.delete(m):s.add(m);
      state.settings.excluded=[...s].sort();
      try{await saveSettings();toast(s.has(m)?'Mois exclu de la moyenne':'Mois réintégré')}catch(_){toast('Enregistrement impossible')}
    });
    li.appendChild(b);ul.appendChild(li);
  }
}

function fillRates(){
  for(const k of ['cantine','internat','demipension']) $('r-'+k).value=fmtNum(state.settings.rates[k]);
  $('demiFrom').value=state.settings.demiFrom||'';
  const box=$('schoolDays');box.innerHTML='';
  const sd=new Set(state.settings.schoolDays||DEFAULTS.schoolDays);
  for(const [n,l] of WD){
    const lab=document.createElement('label');
    lab.innerHTML=`<input type="checkbox" value="${n}"${sd.has(n)?' checked':''}>`;lab.append(l);box.appendChild(lab);
  }
  if(catById[state.cat].rates) updatePerDay();
}

/* ---------- Événements ---------- */
$('prev').onclick=()=>{state.month=shiftMonth(state.month,-1);render()};
$('next').onclick=()=>{state.month=shiftMonth(state.month,1);render()};
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));
  for(const t of ['saisie','liste','bilan']) $('tab-'+t).hidden=t!==state.tab;
}));
$('rateSel').addEventListener('change',computePerDay);
$('days').addEventListener('input',computePerDay);
$('period').addEventListener('change',render);

$('addBtn').addEventListener('click',async()=>{
  const amount=parseAmount($('amount').value);
  const date=$('date').value;
  if(!(amount>0)){toast('Indiquez un montant');$('amount').focus();return}
  if(!date){toast('Indiquez une date');return}
  const c=catById[state.cat];
  const e={date,cat:state.cat,amount,note:$('note').value.trim()};
  if(c.rates){
    e.rateKey=$('rateSel').value;e.rate=state.settings.rates[e.rateKey];
    e.qty=Math.max(1,parseInt($('days').value,10)||1);
  }
  const btn=$('addBtn');btn.disabled=true;
  try{
    await addEntry(e);
    toast('Dépense ajoutée');
    $('note').value='';
    if(c.rates){$('days').value=1;computePerDay()}else $('amount').value='';
    state.month=date.slice(0,7);render();
  }catch(_){toast('Enregistrement impossible, réessayez')}
  btn.disabled=false;
});

$('saveRates').addEventListener('click',async()=>{
  const r={};
  for(const k of ['cantine','internat','demipension']){
    const v=parseAmount($('r-'+k).value);
    if(!(v>=0)){toast('Tarif invalide : '+RATE_LABELS[k]);return}
    r[k]=v;
  }
  state.settings.rates=r;
  state.settings.demiFrom=$('demiFrom').value||'';
  state.settings.schoolDays=[...$('schoolDays').querySelectorAll('input:checked')].map(i=>+i.value);
  try{await saveSettings();updatePerDay();toast('Réglages enregistrés')}catch(_){toast('Enregistrement impossible')}
});

$('exportBtn').addEventListener('click',async()=>{
  const rows=[['date','categorie','montant','jours','tarif','note']];
  for(const e of [...state.entries].sort((a,b)=>a.date.localeCompare(b.date))){
    rows.push([e.date,(catById[e.cat]||{label:e.cat}).label,fmtNum(e.amount.toFixed(2)),e.qty||'',e.rate!=null?fmtNum(e.rate):'',(e.note||'').replace(/"/g,'""')]);
  }
  const csv='\ufeff'+rows.map(r=>r.map(v=>`"${v}"`).join(';')).join('\n');
  const filename='depenses-alimentation-'+todayISO()+'.csv';
  if(downloads){
    try{await downloads.save({filename,data:csv});}
    catch(err){if(err?.code!=='declined') toast('Export impossible')}
    return;
  }
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
});

$('clearBtn').addEventListener('click',async()=>{
  const n=state.entries.length;
  if(!n){toast('Aucune dépense à effacer');return}
  if(!confirm('Effacer les '+n+' dépenses ? Pensez à exporter une sauvegarde avant. Les tarifs sont conservés.')) return;
  try{
    if(state.mode==='db'){for(const e of [...state.entries]) await remote.entries.doc(e.id).delete()}
    else{state.entries=[];saveLocal();render()}
    toast('Toutes les dépenses ont été effacées');
  }catch(_){toast('Effacement incomplet, réessayez')}
});

/* ---------- Import CSV (même format que l'export) ---------- */
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=ch }
    else if(ch==='"') q=true;
    else if(ch===';'){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f='' }
    else f+=ch;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const keyOf=e=>e.date+'|'+e.cat+'|'+Number(e.amount).toFixed(2);
function catFrom(v){
  const t=String(v||'').trim().toLowerCase();
  const c=CATS.find(c=>c.id===t||c.label.toLowerCase()===t);
  return c?c.id:null;
}
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async ev=>{
  const file=ev.target.files[0]; if(!file) return;
  try{
    const rows=parseCSV(await file.text());
    const head=(rows[0]||[]).map(h=>h.trim().toLowerCase());
    const col=n=>head.indexOf(n);
    if(col('date')<0||col('categorie')<0||col('montant')<0){toast('Fichier non reconnu : colonnes date, categorie, montant attendues');return}
    const seen=new Set(state.entries.map(keyOf));
    let added=0,skipped=0;
    for(const r of rows.slice(1)){
      const date=(r[col('date')]||'').trim();
      const cat=catFrom(r[col('categorie')]);
      const amount=parseAmount(r[col('montant')]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!cat||!(amount>0)){skipped++;continue}
      const e={date,cat,amount,note:col('note')>=0?(r[col('note')]||'').trim():''};
      const qty=col('jours')>=0?parseInt(r[col('jours')],10):NaN;
      const rate=col('tarif')>=0?parseAmount(r[col('tarif')]):NaN;
      if(qty>0&&rate>=0){e.qty=qty;e.rate=rate;e.rateKey=cat==='cantine'?'cantine':(Math.abs(rate-state.settings.rates.internat)<0.01?'internat':'demipension')}
      if(seen.has(keyOf(e))){skipped++;continue}
      seen.add(keyOf(e));
      await addEntry(e);added++;
    }
    toast(added+' dépense'+(added>1?'s':'')+' importée'+(added>1?'s':'')+(skipped?', '+skipped+' ignorée'+(skipped>1?'s':''):''));
  }catch(_){toast('Import impossible')}
  ev.target.value='';
});

$('date').value=todayISO();
renderCats();updatePerDay();fillRates();
init();
loadVacances();
</script>
